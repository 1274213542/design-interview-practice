a","去重标识":"Aqua","届别":"27卒早期选考（原26转27）","职种":"设计岗；作者求职方向跨产品工业设计、UI/UX与信息设计","涉及轮次":"二面／终面","核对边界和作品说明":"已读笔记正文","原帖":"打开 X03","英文对照":null,"sheet":"来源索引","url":"https://www.xiaohongshu.com/explore/69c73bbb0000000023026aac"},{"编号":"C18","公司":"游戏行业（跨公司）","来源类型":"参考资料・不进题频","平台":"YouTube（日文自动字幕）","作者／投稿":"ゲームドライブ就活ちゃんねる","去重标识":"C18","届别":"招聘方分享","职种":"产品／UX 设计","涉及轮次":"背景资料","核对边界和作品说明":"已核相应可读范围 约 1:00 招聘视角讲团队作品如何问到“你实际做了哪一部分”，2:00 讲为什么这样设计、花了多少时间，5:00 区分项目跨度与自己的工时。招聘方经验，零候选人计数。","原帖":"打开 C18","英文对照":null,"sheet":"来源索引","url":"https://www.youtube.com/watch?v=aSiWMm15SIg&t=60"}],"guides":[{"title":"群面与各轮面试","html":"\u003ch1>日本 UX／产品设计面试：群面怎么做，作品怎么讲，各轮怎么追问\u003c/h1>\n\u003cp>2026 年 11 月 6 日。题库收录日本招聘的 \u003cstrong>249 条\u003c/strong>问项、追问、讨论主题和任务，保留可回到原帖的出处。候选人用中文或英文讲述在日本应聘的经历，也归入这份档案。一位候选人可能留下多道题，单条记录也可能包含一句紧连的子问，数字用于查找材料。\u003c/p>\n\u003ch2>先练这几道有第二份面经作证的题\u003c/h2>\n\u003cdiv class=\"table-scroll\" tabindex=\"0\" role=\"region\" aria-label=\"面试资料表\">\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>复原后的问题\u003c/th>\n\u003cth>能确认几份独立面经\u003c/th>\n\u003cth>第二个人也被问到了哪一部分\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>\u003cstrong>从作品集选最有把握的一件。\u003c/strong>\u003c/td>\n\u003ctd>\u003cstrong>日本 27 卒，2 人、2 家公司\u003c/strong>\u003c/td>\n\u003ctd>CyberAgent 一面接着问最难的地方；NAVITIME Japan 到终面仍要求实际展示。两份原帖共同强调「有信心」，练习时应能说明自己为什么选这件。\u003ca target=\"_blank\" rel=\"noopener noreferrer\" href=\"https://www.xiaohongshu.com/explore/6aa4fec0000000000d0209ed\">CyberAgent\u003c/a> · \u003ca target=\"_blank\" rel=\"noopener noreferrer\" href=\"https://syukatsu-kaigi.jp/companies/75530/screening_experiences/186730\">NAVITIME Japan\u003c/a>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003cstrong>为什么申请我们这个实习？\u003c/strong>\u003c/td>\n\u003ctd>\u003cstrong>Goodpatch 26 卒 UX，2 人\u003c/strong>\u003c/td>\n\u003ctd>一场 4 位学生、一场 3 位学生，都是面对 1 位 HR。一个人还被问公司印象，另一个人被问从哪里知道公司。两份各有投稿编号。\u003ca target=\"_blank\" rel=\"noopener noreferrer\" href=\"https://www.onecareer.jp/companies/6717/experiences/2026/14620/1076033\">四人场\u003c/a> · \u003ca target=\"_blank\" rel=\"noopener noreferrer\" href=\"https://www.onecareer.jp/companies/6717/experiences/2026/14620/1067675\">三人场\u003c/a>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003cstrong>为什么选我们，同业的其他公司哪里不满足你？\u003c/strong>\u003c/td>\n\u003ctd>\u003cstrong>Cybozu 终面，2 人、两届\u003c/strong>\u003c/td>\n\u003ctd>25 卒和 26 卒都遇到；26 卒二面也问过。适合练到能把自己的择业条件和公司的具体产品、岗位联系起来。\u003ca target=\"_blank\" rel=\"noopener noreferrer\" href=\"https://www.onecareer.jp/companies/651/experiences/2025/2403/1055420\">25卒\u003c/a> · \u003ca target=\"_blank\" rel=\"noopener noreferrer\" href=\"https://www.onecareer.jp/companies/651/experiences/2026/2403/1185318\">26卒\u003c/a>\u003c/td>\n\u003c/tr>\n\u003c/tbody>\u003c/table>\u003c/div>\n\u003ch2>收到“群面”通知，先辨认现场任务\u003c/h2>\n\u003cdiv class=\"table-scroll\" tabindex=\"0\" role=\"region\" aria-label=\"面试资料表\">\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>形式\u003c/th>\n\u003cth>一场真实安排\u003c/th>\n\u003cth>当场要做的事\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>\u003cstrong>共同讨论，最后给结论\u003c/strong>（GD）\u003c/td>\n\u003ctd>电通デジタル 26 卒体验设计岗，一场 5 名学生、2 名面试官，60 分钟，有发表。\u003c/td>\n\u003ctd>一起提出减少电车拥挤的措施。原帖公开到题面与形式，具体角色分工和发表后的问答仍待核。\u003ca target=\"_blank\" rel=\"noopener noreferrer\" href=\"https://syukatsu-kaigi.jp/companies/110342/screening_experiences/group_discussion/1084167\">电通原帖\u003c/a>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003cstrong>多人候选人一起答面试官\u003c/strong>（集団面接）\u003c/td>\n\u003ctd>Goodpatch 让学生轮流讲经历；日本 KREO 的 27 卒设计岗由 3 位学生面对 3 位员工约 60 分钟。\u003c/td>\n\u003ctd>准备好自己的答案和作品。KREO 现场展示作品集，另问申请理由、喜欢哪位设计师和原因。该岗偏广告及促销设计。\u003ca target=\"_blank\" rel=\"noopener noreferrer\" href=\"https://www.onecareer.jp/companies/6717/experiences/2026/14620/1076033\">Goodpatch\u003c/a> · \u003ca target=\"_blank\" rel=\"noopener noreferrer\" href=\"https://www.onecareer.jp/companies/53636/experiences/2027/165825/1397886\">KREO\u003c/a>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003cstrong>多位面试官面一名候选人\u003c/strong>（panel）\u003c/td>\n\u003ctd>日本 IBM 27 卒设计实习一面，一位学生对两位经理级员工，约 60 分钟。\u003c/td>\n\u003ctd>先自我介绍与作品集说明，再回答申请动机。公开记录未给出被点名的具体作品。\u003ca target=\"_blank\" rel=\"noopener noreferrer\" href=\"https://gaishishukatsu.com/selection_reports/41399\">日本 IBM\u003c/a>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003cstrong>入选之后的实习小组项目\u003c/strong>\u003c/td>\n\u003ctd>Goodpatch 的另一篇同人记录写了三天 UX 项目，最终面向 CEO 提案 10 分钟。\u003c/td>\n\u003ctd>练用户研究、把洞察变成新业务，再练发表。要准备申请面试，则回看同一位作者的三人群面。\u003ca target=\"_blank\" rel=\"noopener noreferrer\" href=\"https://www.onecareer.jp/companies/6717/experiences/2026/14620/1067673\">实习项目\u003c/a> · \u003ca target=\"_blank\" rel=\"noopener noreferrer\" href=\"https://www.onecareer.jp/companies/6717/experiences/2026/14620/1067675\">入选前的三人面试\u003c/a>\u003c/td>\n\u003c/tr>\n\u003c/tbody>\u003c/table>\u003c/div>\n\u003cp>\u003cstrong>用减少电车拥挤的题练习怎么开口。\u003c/strong> 以下日语和中文均为练习改写。可以先约定讨论哪种拥挤场景，再比较措施的影响和实施条件。\u003ca target=\"_blank\" rel=\"noopener noreferrer\" href=\"https://syukatsu-kaigi.jp/companies/110342/screening_experiences/group_discussion/1084167\">对应的真实 GD 题\u003c/a>\u003c/p>\n\u003cdiv class=\"table-scroll\" tabindex=\"0\" role=\"region\" aria-label=\"面试资料表\">\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>时机\u003c/th>\n\u003cth>日语练习改写\u003c/th>\n\u003cth>中文意译\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>统一讨论范围\u003c/td>\n\u003ctd>まず、どの時間帯や路線の混雑を対象にするか決めませんか。\u003c/td>\n\u003ctd>我们先定一下，讨论哪个时段或哪类线路的拥挤，好吗？\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>接住另一人的意见\u003c/td>\n\u003ctd>今の案は、利用する時間をずらすということですね。どんな人なら取り入れやすいでしょうか。\u003c/td>\n\u003ctd>你刚才的方案是错开乘车时间。哪类乘客比较容易采用？\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>比较方案\u003c/td>\n\u003ctd>残り時間を考えて、混雑を減らす効果と実施のしやすさで比べませんか。\u003c/td>\n\u003ctd>考虑到剩余时间，我们按缓解拥挤的效果和实施难度来比较，好吗？\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>收束并发表\u003c/td>\n\u003ctd>私たちは〇〇を提案します。対象は△△で、□□の効果を期待しています。効果の確認には◇◇を調べたいです。\u003c/td>\n\u003ctd>我们建议……，针对的对象是……，希望带来……的效果。要确认效果，我们还想调查……。\u003c/td>\n\u003c/tr>\n\u003c/tbody>\u003c/table>\u003c/div>\n\u003ch2>同一位候选人进到下一关，面试在问什么\u003c/h2>\n\u003cp>\u003cstrong>电通デジタル的26卒体验设计本选考，三组都要发表，但讨论的事很不一样。\u003c/strong> 第一组5名学生、2名面试官，60分钟，题目是「如何减少电车拥挤」，下一轮单面问为什么选体验设计、能在部门里发挥什么作用。第二组4名学生、1名面试官，40分钟，要在传单和社交媒体之间取舍，之后2名学生一起面试，被问喜欢哪则广告、面对高目标时看重什么。第三组5名学生、1名面试官，40分钟，讨论企业成长更需要专才还是通才，后续双人面试问难以相处的人和压力。三人都没写发表完当场被追问什么。\u003ca target=\"_blank\" rel=\"noopener noreferrer\" href=\"https://syukatsu-kaigi.jp/companies/110342/screening_experiences/group_discussion/1084167\">电车题\u003c/a> · \u003ca target=\"_blank\" rel=\"noopener noreferrer\" href=\"https://syukatsu-kaigi.jp/companies/110342/screening_experiences/group_discussion/1005062\">媒介选择题\u003c/a> · \u003ca target=\"_blank\" rel=\"noopener noreferrer\" href=\"https://syukatsu-kaigi.jp/companies/110342/screening_experiences/group_discussion/833481\">人才选择题\u003c/a>\u003c/p>\n\u003cp>\u003cstrong>申请UX实习时，先看谁在跟谁说话。\u003c/strong> Goodpatch一位候选人和另外3名学生面对1名HR，轮流讲自己做过什么、遇到什么困难，再谈申请理由。Visional另一场是5名学生一起讨论人力资源行业的问题，限时30分钟，作者只透露题目方向。还有一位在个人终面被问「如果组一支五人团队，你想找什么样的人？」他真正参加实习后，才与3名工程师组队，为减少新卒候选人辞谢录用设计服务。\u003ca target=\"_blank\" rel=\"noopener noreferrer\" href=\"https://www.onecareer.jp/companies/6717/experiences/2026/14620/1076033\">Goodpatch集体面试\u003c/a> · \u003ca target=\"_blank\" rel=\"noopener noreferrer\" href=\"https://www.onecareer.jp/companies/378/experiences/2026/1734/1109282\">Visional讨论\u003c/a> · \u003ca target=\"_blank\" rel=\"noopener noreferrer\" href=\"https://www.onecareer.jp/companies/378/experiences/2025/1734/1058368\">个人终面\u003c/a> · \u003ca target=\"_blank\" rel=\"noopener noreferrer\" href=\"https://www.onecareer.jp/companies/378/experiences/2025/1734/1058543\">实习项目\u003c/a>\u003c/p>\n\u003cp>\u003cstrong>准备作品时，也练习交代自己为什么这样选。\u003c/strong> Accenture Song一位27卒设计候选人一面展示两件作品，对方追问为什么最终选了这个方案，接着展示事前课题，再解释思考过程。IBJ同届候选人到终面时，被问未来想做什么，以及为什么能持续尝试那么多不同的事。中文面经里，CyberAgent的UTANI乌塔尼走的是有工作经历者也能申请的Re:Career路线。一面先用两三分钟介绍作品集，再挑最有信心的一件讲最难之处，二面则问想借整本作品集传达什么。\u003ca target=\"_blank\" rel=\"noopener noreferrer\" href=\"https://www.onecareer.jp/companies/4/experiences/2027/166542/1369394\">Accenture Song一面\u003c/a> · \u003ca target=\"_blank\" rel=\"noopener noreferrer\" href=\"https://syukatsu-kaigi.jp/companies/79568/screening_experiences/190609\">IBJ四轮实录\u003c/a> · \u003ca target=\"_blank\" rel=\"noopener noreferrer\" href=\"https://www.xiaohongshu.com/explore/6aa4fec0000000000d0209ed\">CyberAgent中文自述\u003c/a>\u003c/p>\n\u003cp>同样是终面，\u003cstrong>电通数码\u003c/strong>有一位 26 卒体验设计候选人被问到，如果分去的部门做不了最想做的工作，是否能接受。\u003cstrong>Accenture Song\u003c/strong> 的 27 卒设计候选人则被役员问，同业中为什么选择这里，想做怎样的设计。两家公司都能定位到具体轮次；练终面时应分别准备岗位弹性和设计方向。\u003ca target=\"_blank\" rel=\"noopener noreferrer\" href=\"https://syukatsu-kaigi.jp/companies/110342/screening_experiences/interview/889613\">电通数码终面\u003c/a> · \u003ca target=\"_blank\" rel=\"noopener noreferrer\" href=\"https://www.onecareer.jp/companies/4/experiences/2027/166542/1369410\">Accenture Song 终面\u003c/a>\u003c/p>\n\u003cp>\u003cstrong>你关注的其他日本公司\u003c/strong>也保留在公司档案中。WeddingPark 有新卒 Web 设计一面的成长经历、设计动机；NEZOT 有 Web 设计终面要求把一段经历拆成三个发挥实力的因素；EPSON 能证实 UI/UX 实习申请的作品件数，Drecom 能核到 CG 岗一面。对 EPSON 的现场追问、Drecom 游戏 UI 同职种的真实作品题，目前仍缺可核的候选人原文。\u003ca target=\"_blank\" rel=\"noopener noreferrer\" href=\"https://jobtalk.jp/companies/24853/answers/7432644\">WeddingPark\u003c/a> · \u003ca target=\"_blank\" rel=\"noopener noreferrer\" href=\"https://jobtalk.jp/companies/9420253/answers/7431785\">NEZOT\u003c/a> · \u003ca target=\"_blank\" rel=\"noopener noreferrer\" href=\"https://www.recruit.epson.jp/newgraduate/pdf/2025summer-intermship.pdf\">EPSON 招聘资料\u003c/a> · \u003ca target=\"_blank\" rel=\"noopener noreferrer\" href=\"https://jobtalk.jp/companies/1088/answers/7602507\">Drecom\u003c/a>\u003c/p>\n\u003ch2>中文、英文与视频从哪里看\u003c/h2>\n\u003cul>\n\u003cli>\u003cstrong>日语视频。\u003c/strong> 想看 GD 怎么起步，可看 PORT キャリア 模拟开场的分工、时间分配、确定讨论对象。想练作品口述，则看ユウクリ就活 TV 演示怎样用有限时间突出下功夫的地方。这两支都是演示，样题从企业真题计数中分开。\u003ca target=\"_blank\" rel=\"noopener noreferrer\" href=\"https://www.youtube.com/watch?v=wb1x5TIPagM&t=25s\">YouTube · GD 开场\u003c/a> · \u003ca target=\"_blank\" rel=\"noopener noreferrer\" href=\"https://www.youtube.com/watch?v=6u-eJpl8aL8&t=50s\">YouTube · 作品集口述\u003c/a>\u003c/li>\n\u003cli>\u003cstrong>在日本的英文面试与英文材料。\u003c/strong> Simon 用中文回忆东京 Indeed 的转职：主管先听一至两个既有项目，另做一项产品课题后，对方才问「若只保留一个功能会留什么」「多三个月会如何改」「怎样衡量成功」。HENNGE 英文官网则列有作品集、日语非正式面谈、约 2–3 小时设计作业、HR、招聘团队和役员面试，没有公开题干。前一份可练具体问题，后一份可校准岗位流程。\u003ca target=\"_blank\" rel=\"noopener noreferrer\" href=\"https://aapd.com.tw/all-articles/ui-ux-interview-experience-japan-australia\">Indeed 东京候选人\u003c/a> · \u003ca target=\"_blank\" rel=\"noopener noreferrer\" href=\"https://recruit.hennge.com/en/mid-career-ngh/ui-ux-designer/\">HENNGE 英文招聘页\u003c/a>\u003c/li>\n\u003cli>\u003cstrong>中文作者的日本招聘经历。\u003c/strong> CyberAgent 的 UTANI乌塔尼按面谈、一面、二面、三面写自己的经历，文中的 Re:Career 路线、作品展示时长和轮次已保留在上文。按公司和招聘场景查找时，可同时检索中文公司名、日文职种和毕业届。\u003ca target=\"_blank\" rel=\"noopener noreferrer\" href=\"https://www.xiaohongshu.com/explore/6aa4fec0000000000d0209ed\">CyberAgent 中文自述\u003c/a>\u003c/li>\n\u003cli>\u003cstrong>小红书、日语就职网站与掲示板。\u003c/strong> 日本岗位采用小红书本人记录，以及 ONE CAREER、就活会議、外資就活交叉核对雇主、职种、毕业届和具体轮次。みん就与一般论坛的线索按可核程度保留，另有日本 GD 的中文视频抽帧记录。登录后才显示、作者主动隐去或仅有 AI 摘要的部分，均在题库注明可读范围。\u003c/li>\n\u003c/ul>\n\u003cp>\u003cstrong>自己用作品集练一轮。\u003c/strong> 选一件最能代表你的作品，再选一件能明确交代自己分工的团队作品。给每件各想清楚三件事。当时还考虑过哪种做法，凭什么放弃；哪处是你亲手决定的；拿什么观察或数据判断做对了。先用两三分钟讲作品，再让练习伙伴随时打断，任选表里的一个追问。对尚未上线的学生项目，可以明确说已做过什么验证、下一步想验证什么。\u003c/p>\n"},{"title":"日本重点公司","html":"\u003ch1>日本新卒 IT 设计岗，作品集面试怎么问\u003c/h1>\n\u003cp>\u003cstrong>先挑一件自己最有信心的作品。\u003c/strong> 这是这轮检索里最值得先练的作品题。CyberAgent 的 27 卒候选人先用两三分钟概括作品集，再回答哪一件最有信心、哪里最难。NAVITIME Japan 的另一位 27 卒候选人在终面被直接要求展示自己的得意作。两名考生、两家公司、两个不同轮次，都需要当场选作品。两人的作品名均未公开。\u003ca target=\"_blank\" rel=\"noopener noreferrer\" href=\"https://www.xiaohongshu.com/explore/6aa4fec0000000000d0209ed\">小红书 · UTANI乌塔尼\u003c/a> · \u003ca target=\"_blank\" rel=\"noopener noreferrer\" href=\"https://syukatsu-kaigi.jp/companies/75530/screening_experiences/186730\">27卒 NAVITIME · 终面\u003c/a>\u003c/p>\n\u003cp>\u003cstrong>再挑一件团队作品，练习把“我们做了什么”讲到“我当时怎么做决定”。\u003c/strong> giftee 的 25 卒设计师被问大学期间与人合作完成过什么，她用刚刚展示的、从六人小组合作衍生的作品作答。Money Forward 的 26 卒候选人在二面和两位设计师一起看作品集，被要求讲团队项目，同场还问到组内意见分歧的细节。\u003ca target=\"_blank\" rel=\"noopener noreferrer\" href=\"https://syukatsu-kaigi.jp/companies/150738/screening_experiences/99855\">25卒 giftee · 一面\u003c/a> · \u003ca target=\"_blank\" rel=\"noopener noreferrer\" href=\"https://syukatsu-kaigi.jp/companies/146331/screening_experiences/155739\">26卒 Money Forward · 二面\u003c/a>\u003c/p>\n\u003ch2>同一个问题，有几位候选人遇到过\u003c/h2>\n\u003cp>左栏的日语是根据原帖整理的口练问法。少量原帖逐字短句另行标明。\u003c/p>\n\u003cdiv class=\"table-scroll\" tabindex=\"0\" role=\"region\" aria-label=\"面试资料表\">\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>可以怎么问\u003c/th>\n\u003cth>中文与出处\u003c/th>\n\u003cth>独立候选人\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>ポートフォリオの中で、一番自信のある作品を紹介してください。\u003c/td>\n\u003ctd>\u003cstrong>从作品集中选最有把握的一件。\u003c/strong> CyberAgent 一面接着问最难的部分。NAVITIME Japan 终面让候选人发表。\u003ca target=\"_blank\" rel=\"noopener noreferrer\" href=\"https://www.xiaohongshu.com/explore/6aa4fec0000000000d0209ed\">小红书 · UTANI乌塔尼\u003c/a> · \u003ca target=\"_blank\" rel=\"noopener noreferrer\" href=\"https://syukatsu-kaigi.jp/companies/75530/screening_experiences/186730\">27卒 NAVITIME · 终面\u003c/a>\u003c/td>\n\u003ctd>\u003cstrong>2 人，跨公司，均为 27 卒\u003c/strong>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>チームで取り組んだ経験を教えてください。\u003c/td>\n\u003ctd>\u003cstrong>讲一次团队协作。\u003c/strong> giftee 一面是候选人主动用刚展示的作品作答。Money Forward 二面则是面试官请她结合眼前的作品集讲。Cybozu 25 卒一面只明确问团队经验。\u003ca target=\"_blank\" rel=\"noopener noreferrer\" href=\"https://syukatsu-kaigi.jp/companies/150738/screening_experiences/99855\">25卒 giftee · 一面\u003c/a> · \u003ca target=\"_blank\" rel=\"noopener noreferrer\" href=\"https://syukatsu-kaigi.jp/companies/146331/screening_experiences/155739\">26卒 Money Forward · 二面\u003c/a> · \u003ca target=\"_blank\" rel=\"noopener noreferrer\" href=\"https://www.onecareer.jp/companies/651/experiences/2025/2403/1055418\">25卒 Cybozu · 一面\u003c/a>\u003c/td>\n\u003ctd>\u003cstrong>3 人、3 家公司\u003c/strong>。其中 \u003cstrong>2 人\u003c/strong>的作品集与该题明确相连。\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>デザイナーとしての強みは何ですか。\u003c/td>\n\u003ctd>\u003cstrong>你的设计优势是什么？\u003c/strong> CyberAgent 一位在二面被问强项与弱项，另一位在游戏／服务部门分面被问优势。共同部分是优势。\u003ca target=\"_blank\" rel=\"noopener noreferrer\" href=\"https://www.xiaohongshu.com/explore/6aa4fec0000000000d0209ed\">小红书 · UTANI乌塔尼\u003c/a> · \u003ca target=\"_blank\" rel=\"noopener noreferrer\" href=\"https://www.xiaohongshu.com/explore/6a50df1d000000001700a244\">小红书 · 人肉まん\u003c/a>\u003c/td>\n\u003ctd>\u003cstrong>2 人，同公司、同为 27 卒\u003c/strong>。前者走 Re:Career，有约一年半营销工作经历。\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>同じ業界の中で、なぜ当社なのですか。\u003c/td>\n\u003ctd>\u003cstrong>同是 IT 公司，为什么选我们？\u003c/strong> Cybozu 25 卒终面问为什么是这家。26 卒二面、终面都追问为什么别家公司不行。\u003ca target=\"_blank\" rel=\"noopener noreferrer\" href=\"https://www.onecareer.jp/companies/651/experiences/2025/2403/1055420\">25卒 Cybozu · 终面\u003c/a> · \u003ca target=\"_blank\" rel=\"noopener noreferrer\" href=\"https://www.onecareer.jp/companies/651/experiences/2026/2403/1185318\">26卒 Cybozu · 终面\u003c/a>\u003c/td>\n\u003ctd>\u003cstrong>2 人，同公司，两人均在终面遇到\u003c/strong>。26 卒重复被问仍只计一人。\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>就職先を選ぶとき、何を大切にしていますか。\u003c/td>\n\u003ctd>\u003cstrong>你选公司看重什么？\u003c/strong> Cybozu 25 卒一面问选择标准以及哪里符合。26 卒二面逐项深挖，到终面又问。\u003ca target=\"_blank\" rel=\"noopener noreferrer\" href=\"https://www.onecareer.jp/companies/651/experiences/2025/2403/1055418\">25卒 Cybozu · 一面\u003c/a> · \u003ca target=\"_blank\" rel=\"noopener noreferrer\" href=\"https://www.onecareer.jp/companies/651/experiences/2026/2403/1185317\">26卒 Cybozu · 二面（跳过一面）\u003c/a> · \u003ca target=\"_blank\" rel=\"noopener noreferrer\" href=\"https://www.onecareer.jp/companies/651/experiences/2026/2403/1185318\">26卒 Cybozu · 终面\u003c/a>\u003c/td>\n\u003ctd>\u003cstrong>2 人，同公司\u003c/strong>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>将来、どのようなデザイナーになりたいですか。\u003c/td>\n\u003ctd>\u003cstrong>想成为什么样的设计师？\u003c/strong> Cybozu 25 卒一面与 26 卒终面都出现。后者暑期实习时也遇过同一问。\u003ca target=\"_blank\" rel=\"noopener noreferrer\" href=\"https://www.onecareer.jp/companies/651/experiences/2025/2403/1055418\">25卒 Cybozu · 一面\u003c/a> · \u003ca target=\"_blank\" rel=\"noopener noreferrer\" href=\"https://www.onecareer.jp/companies/651/experiences/2026/2403/1185318\">26卒 Cybozu · 终面\u003c/a> · \u003ca target=\"_blank\" rel=\"noopener noreferrer\" href=\"https://www.onecareer.jp/companies/651/experiences/2026/2403/1155254\">26卒 Cybozu · 暑期实习面试\u003c/a>\u003c/td>\n\u003ctd>\u003cstrong>2 人，同公司\u003c/strong>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>なぜこのインターンに応募したのですか。\u003c/td>\n\u003ctd>\u003cstrong>为什么报这个实习？\u003c/strong> Goodpatch 的两位 26 卒 UX 候选人分别记下小组面试的志望动机。一位还记得对设计的兴趣、学生经历和困难。\u003ca target=\"_blank\" rel=\"noopener noreferrer\" href=\"https://www.onecareer.jp/companies/6717/experiences/2026/14620/1076033\">26卒 Goodpatch · 集団面接\u003c/a> · \u003ca target=\"_blank\" rel=\"noopener noreferrer\" href=\"https://www.onecareer.jp/companies/6717/experiences/2026/14620/1067675\">26卒 Goodpatch · 集団面接\u003c/a>\u003c/td>\n\u003ctd>\u003cstrong>2 人，同公司、实习\u003c/strong>\u003c/td>\n\u003c/tr>\n\u003c/tbody>\u003c/table>\u003c/div>\n\u003cp>CyberAgent 两位作者还分别写了“\u003cstrong>制作整本作品集\u003c/strong>时注意什么”和“\u003cstrong>做作品\u003c/strong>时最重视什么”。前者可以谈选项目与编排，后者需要举出项目内的取舍。Excel 给它们不同题号。\u003ca target=\"_blank\" rel=\"noopener noreferrer\" href=\"https://www.xiaohongshu.com/explore/6aa4fec0000000000d0209ed\">小红书 · UTANI乌塔尼\u003c/a> · \u003ca target=\"_blank\" rel=\"noopener noreferrer\" href=\"https://www.xiaohongshu.com/explore/6a50df1d000000001700a244\">小红书 · 人肉まん\u003c/a>\u003c/p>\n\u003ch2>一面、二面、三面、终面分别怎样问\u003c/h2>\n\u003cdiv class=\"table-scroll\" tabindex=\"0\" role=\"region\" aria-label=\"面试资料表\">\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>轮次\u003c/th>\n\u003cth>一场具体面试\u003c/th>\n\u003cth>同一轮次的另一种问法\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>\u003cstrong>一面\u003c/strong>\u003c/td>\n\u003ctd>CyberAgent Re:Career 候选人先共享作品集、讲 2–3 分钟，接着答最有信心的一件和其中的难处。\u003ca target=\"_blank\" rel=\"noopener noreferrer\" href=\"https://www.xiaohongshu.com/explore/6aa4fec0000000000d0209ed\">小红书 · UTANI乌塔尼\u003c/a>\u003c/td>\n\u003ctd>Cybozu 25 卒先谈择业标准、团队经历和理想的设计师形象。WeddingPark 的 Web 设计一面也有人从小学到大学的活动被问起。\u003ca target=\"_blank\" rel=\"noopener noreferrer\" href=\"https://www.onecareer.jp/companies/651/experiences/2025/2403/1055418\">25卒 Cybozu · 一面\u003c/a> · \u003ca target=\"_blank\" rel=\"noopener noreferrer\" href=\"https://jobtalk.jp/companies/24853/answers/7432644\">転職会議 A05\u003c/a>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003cstrong>二面\u003c/strong>\u003c/td>\n\u003ctd>CyberAgent 这位候选人与两位设计师分别交流，谈作品集想表达什么、制作时注意了什么，还被问为何来日本。她没有把每道题分配给具体面试官。\u003ca target=\"_blank\" rel=\"noopener noreferrer\" href=\"https://www.xiaohongshu.com/explore/6aa4fec0000000000d0209ed\">小红书 · UTANI乌塔尼\u003c/a>\u003c/td>\n\u003ctd>GMO ペパボ 27 卒一面谈作品集，二面则要用约 10 分钟展示预先提交的课题，之后接受追问与反馈。IBJ 的两位设计师问的是为什么开始学设计、一路怎样学。\u003ca target=\"_blank\" rel=\"noopener noreferrer\" href=\"https://syukatsu-kaigi.jp/companies/112674/screening_experiences/184452\">27卒 GMOペパボ · 一面\u003c/a> · \u003ca target=\"_blank\" rel=\"noopener noreferrer\" href=\"https://syukatsu-kaigi.jp/companies/112674/screening_experiences/184452\">27卒 GMOペパボ · 二面\u003c/a> · \u003ca target=\"_blank\" rel=\"noopener noreferrer\" href=\"https://syukatsu-kaigi.jp/companies/79568/screening_experiences/190609\">27卒 IBJ · 二面\u003c/a>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003cstrong>三面\u003c/strong>\u003c/td>\n\u003ctd>IBJ 27 卒的三面由人事部长和设计部长担任，线上 70 分钟。问从小学到大学努力做过什么，又问现在缺什么能力、准备怎样学会。\u003ca target=\"_blank\" rel=\"noopener noreferrer\" href=\"https://syukatsu-kaigi.jp/companies/79568/screening_experiences/190609\">27卒 IBJ · 三面\u003c/a>\u003c/td>\n\u003ctd>CyberAgent Re:Career 的三面沿个人经历追问每个阶段为何作那个选择。楽天设计岗一篇中文记录的三面则有志望动机，以及 AI Agent、D2C 讨论。作者没标毕业届。\u003ca target=\"_blank\" rel=\"noopener noreferrer\" href=\"https://www.xiaohongshu.com/explore/6aa4fec0000000000d0209ed\">小红书 · UTANI乌塔尼\u003c/a> · \u003ca target=\"_blank\" rel=\"noopener noreferrer\" href=\"https://www.xiaohongshu.com/explore/68032602000000001c0060b3\">小红书 · 鮨.\u003c/a>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003cstrong>终面\u003c/strong>\u003c/td>\n\u003ctd>Cybozu 25 卒除公司选择外，还问“对我们自己的产品，你想改哪里”，以及入社想做哪一块。点评对象是雇主的产品。\u003ca target=\"_blank\" rel=\"noopener noreferrer\" href=\"https://www.onecareer.jp/companies/651/experiences/2025/2403/1055420\">25卒 Cybozu · 终面\u003c/a>\u003c/td>\n\u003ctd>NAVITIME 仍会看作品。IBJ 代表现场问未来想做什么、成为什么样的人、为什么能持续尝试新事。Goodpatch 则有候选人被代表深入追问经历和价值观的变化。\u003ca target=\"_blank\" rel=\"noopener noreferrer\" href=\"https://syukatsu-kaigi.jp/companies/75530/screening_experiences/186730\">27卒 NAVITIME · 终面\u003c/a> · \u003ca target=\"_blank\" rel=\"noopener noreferrer\" href=\"https://syukatsu-kaigi.jp/companies/79568/screening_experiences/190609\">27卒 IBJ · 终面\u003c/a> · \u003ca target=\"_blank\" rel=\"noopener noreferrer\" href=\"https://www.wantedly.com/companies/goodpatch/post_articles/1059442\">Goodpatch · 鈴木さん\u003c/a>\u003c/td>\n\u003c/tr>\n\u003c/tbody>\u003c/table>\u003c/div>\n\u003cp>如果想按真实顺序做一次四轮模拟，可以直接用 \u003cstrong>IBJ 27 卒\u003c/strong>。同一位设计师的一面是人事，二面是两位设计师，三面是人事与设计负责人，终面是公司代表。四轮都能核到题。\u003ca target=\"_blank\" rel=\"noopener noreferrer\" href=\"https://syukatsu-kaigi.jp/companies/79568/screening_experiences/190609\">27卒 IBJ · 一面\u003c/a>\u003c/p>\n\u003ch2>重点公司\u003c/h2>\n\u003cdiv class=\"table-scroll\" tabindex=\"0\" role=\"region\" aria-label=\"面试资料表\">\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>公司\u003c/th>\n\u003cth>可以据此准备什么\u003c/th>\n\u003cth>材料边界\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>\u003cstrong>CyberAgent\u003c/strong>\u003c/td>\n\u003ctd>两份 27 卒中文亲历可互查。日文新卒平面设计一面另见三分钟介绍、最下功夫的作品、团队为什么成立及本人职责。\u003ca target=\"_blank\" rel=\"noopener noreferrer\" href=\"https://www.xiaohongshu.com/explore/6aa4fec0000000000d0209ed\">小红书 · UTANI乌塔尼\u003c/a> · \u003ca target=\"_blank\" rel=\"noopener noreferrer\" href=\"https://www.xiaohongshu.com/explore/6a50df1d000000001700a244\">小红书 · 人肉まん\u003c/a> · \u003ca target=\"_blank\" rel=\"noopener noreferrer\" href=\"https://jobtalk.jp/companies/1524/answers/8960024\">転職会議 A01\u003c/a> · \u003ca target=\"_blank\" rel=\"noopener noreferrer\" href=\"https://jobtalk.jp/companies/1524/answers/8132203\">転職会議 A02\u003c/a>\u003c/td>\n\u003ctd>日文帖只披露面试年。限时介绍两边都出现，跨平台身份和毕业届待确认。另有 CG 终面，单列相邻职种。\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003cstrong>Goodpatch\u003c/strong>\u003c/td>\n\u003ctd>26 卒服务设计师田附记得两句原文，「なぜそう考えたのか」「どこに違和感を持ったのか」。意思是，为什么会那样判断，究竟哪里让你觉得不对？另一位 26 卒服务设计师铃木谈到终面的个人经历与价值观。\u003ca target=\"_blank\" rel=\"noopener noreferrer\" href=\"https://www.wantedly.com/companies/goodpatch/post_articles/1057114\">Goodpatch · 田附さん\u003c/a> · \u003ca target=\"_blank\" rel=\"noopener noreferrer\" href=\"https://www.wantedly.com/companies/goodpatch/post_articles/1059442\">Goodpatch · 鈴木さん\u003c/a>\u003c/td>\n\u003ctd>田附把课题选考和面试合在一起举例，没把两句绑定某次终面。新卒二面“制作中最喜欢哪个环节”的另一帖未披露职种。小红书两帖是辅导、书类通过。\u003ca target=\"_blank\" rel=\"noopener noreferrer\" href=\"https://jobtalk.jp/companies/3949802/answers/9079735\">転職会議 A08\u003c/a> · \u003ca target=\"_blank\" rel=\"noopener noreferrer\" href=\"https://www.xiaohongshu.com/explore/69762160000000002103d6e3\">小红书 · 年糕棉花糖\u003c/a> · \u003ca target=\"_blank\" rel=\"noopener noreferrer\" href=\"https://www.xiaohongshu.com/explore/6a100fb2000000003503b521\">小红书 · 毛毛牦蚝\u003c/a>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003cstrong>WeddingPark\u003c/strong>\u003c/td>\n\u003ctd>两份新卒 Web 设计一面投稿。一份问从小到大的活动、为何想做设计。另一份问学生时代最投入的事、为什么投这家公司。\u003ca target=\"_blank\" rel=\"noopener noreferrer\" href=\"https://jobtalk.jp/companies/24853/answers/7432644\">転職会議 A05\u003c/a> · \u003ca target=\"_blank\" rel=\"noopener noreferrer\" href=\"https://jobtalk.jp/companies/24853/answers/7650927\">転職会議 A06\u003c/a>\u003c/td>\n\u003ctd>仅有 2024、2025 面试年。检索到的后续轮次不少是业务、策划岗位。\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003cstrong>EPSON\u003c/strong>\u003c/td>\n\u003ctd>2025 夏季实习的打印机及 App UI/UX 岗要求用 PDF 提交约 \u003cstrong>2–3 件作品\u003c/strong>，还可能事先做产品 UI 调查。\u003ca target=\"_blank\" rel=\"noopener noreferrer\" href=\"https://www.recruit.epson.jp/newgraduate/pdf/2025summer-intermship.pdf\">B08 · セイコーエプソン官网PDF\u003c/a>\u003c/td>\n\u003ctd>可核到的是实习要求。现场点名哪件、讲多久、如何追问，仍缺候选人的公开记录。\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003cstrong>NEZOT／WDB\u003c/strong>\u003c/td>\n\u003ctd>NEZOT 新卒 Web 设计师终面被问，从学生时期努力过的一件事里，说出\u003cstrong>三个\u003c/strong>让自己发挥出实力的因素。还问喜欢什么书。\u003ca target=\"_blank\" rel=\"noopener noreferrer\" href=\"https://jobtalk.jp/companies/9420253/answers/7431785\">転職会議 B04\u003c/a>\u003c/td>\n\u003ctd>终面只知 2024 年。另一个二面有设计部门员工参与，具体职位未知。集团官网把 NEZOT 设计岗与 WDB 基础设施工程师分列。\u003ca target=\"_blank\" rel=\"noopener noreferrer\" href=\"https://jobtalk.jp/companies/9420253/answers/9138298\">転職会議 B05\u003c/a> · \u003ca target=\"_blank\" rel=\"noopener noreferrer\" href=\"https://www.wdbhd.co.jp/recruit/graduate/event/grade-fourth/company-orientation.html\">B12 · WDBグループ官方招聘\u003c/a>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003cstrong>Drecom\u003c/strong>\u003c/td>\n\u003ctd>可定位的一面记录属于 CG 设计，问趋势及游戏行业观点。\u003ca target=\"_blank\" rel=\"noopener noreferrer\" href=\"https://jobtalk.jp/companies/1088/answers/7602507\">転職会議 A13\u003c/a>\u003c/td>\n\u003ctd>本轮未核到 25–27 卒\u003cstrong>游戏 UI\u003c/strong> 设计师的作品集实问。流传的“怎样参与开发”一帖属于游戏程序员。\u003ca target=\"_blank\" rel=\"noopener noreferrer\" href=\"https://jobtalk.jp/companies/1088/answers/7181859\">程序员原帖\u003c/a>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003cstrong>CONCENT\u003c/strong>\u003c/td>\n\u003ctd>一份平面设计终面问毕业设计主题、创作时留意什么。另一份谈到怎样把商品卖出去。Web 相关岗一面问为何想用设计解决提交作业里的那个问题。\u003ca target=\"_blank\" rel=\"noopener noreferrer\" href=\"https://jobtalk.jp/companies/23162/answers/8220208\">転職会議 B01\u003c/a> · \u003ca target=\"_blank\" rel=\"noopener noreferrer\" href=\"https://jobtalk.jp/companies/23162/answers/8996490\">転職会議 B02\u003c/a> · \u003ca target=\"_blank\" rel=\"noopener noreferrer\" href=\"https://jobtalk.jp/companies/23162/answers/8042589\">転職会議 B03\u003c/a>\u003c/td>\n\u003ctd>前两帖确定是设计岗，毕业届不明。第三帖职位只标 Web 相关。\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003cstrong>Mercari\u003c/strong>\u003c/td>\n\u003ctd>新卒 Web 设计师一面被问设计动机、以往决策理由和“如果改进我们现有的 XX 功能，你会怎么做”。\u003ca target=\"_blank\" rel=\"noopener noreferrer\" href=\"https://jobtalk.jp/companies/421853/answers/8605595\">転職会議 B06\u003c/a>\u003c/td>\n\u003ctd>毕业届和功能名未公开。另有 UX 实习生回忆。原帖里问“你喜欢 Mercari 哪里”的是候选人自己。\u003ca target=\"_blank\" rel=\"noopener noreferrer\" href=\"https://note.com/mercari_design/n/n60fe0e96185a\">B10 · 原帖\u003c/a>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003cstrong>BASE、LINEヤフー、KEYENCE\u003c/strong>\u003c/td>\n\u003ctd>LINEヤフー 26 卒设计岗有官方作品集要求。KEYENCE 有商品／UI 学生实习的作品集反馈以及现场工作坊实例。\u003ca target=\"_blank\" rel=\"noopener noreferrer\" href=\"https://lydesign.jp/n/n2187b4da1983\">B13 · 原帖\u003c/a> · \u003ca target=\"_blank\" rel=\"noopener noreferrer\" href=\"https://syukatsu-kaigi.jp/companies/34080/intern_experiences/37927\">24卒（历史旁证） キーエンス · 实习申请、入选后的一日工作坊\u003c/a>\u003c/td>\n\u003ctd>BASE 27 卒公开采访谈工程师。KEYENCE 的候选人实例是 24 卒，画硬件／UI 草案发生在入选之后。\u003ca target=\"_blank\" rel=\"noopener noreferrer\" href=\"https://basebook.binc.jp/entry/2026/05/19/110000\">B11 · BASE Book\u003c/a> · \u003ca target=\"_blank\" rel=\"noopener noreferrer\" href=\"https://www.keyence-jobs.jp/recruit/internship/\">E03 · KEYENCE 新卒採用\u003c/a>\u003c/td>\n\u003c/tr>\n\u003c/tbody>\u003c/table>\u003c/div>\n\u003ch2>哪些作品能看到，哪些追问能还原\u003c/h2>\n\u003col>\n\u003cli>\u003cstrong>候选人自己选的团队 App。\u003c/strong> Cybozu 25 卒候选人为二面重做了讲稿，选团队完成的 App，交代自己负责 App 设计，也放入想改进的地方。她明确记下的问项是，过去做产品设计和现在做协作软件有多匹配。讲稿中自备的改进点，与终面实际被问的“想改公司产品哪里”，分属两个场景。\u003ca target=\"_blank\" rel=\"noopener noreferrer\" href=\"https://www.onecareer.jp/companies/651/experiences/2025/2403/1055419\">25卒 Cybozu · 二面\u003c/a> · \u003ca target=\"_blank\" rel=\"noopener noreferrer\" href=\"https://www.onecareer.jp/companies/651/experiences/2025/2403/1055420\">25卒 Cybozu · 终面\u003c/a>\u003c/li>\n\u003cli>\u003cstrong>面试官从毕业设计切入。\u003c/strong> CONCENT 平面设计终面围绕毕业设计的主题和制作意图展开。另一次非正式面谈则让人推荐作品集里的一件。两份都没披露作品名。\u003ca target=\"_blank\" rel=\"noopener noreferrer\" href=\"https://jobtalk.jp/companies/23162/answers/8220208\">転職会議 B01\u003c/a> · \u003ca target=\"_blank\" rel=\"noopener noreferrer\" href=\"https://jobtalk.jp/companies/23162/answers/9074141\">転職会議 B14\u003c/a>\u003c/li>\n\u003cli>\u003cstrong>顺着团队经历继续问。\u003c/strong> Visional 的 26 卒产品设计实习一面让人讲和别人一起完成的事。候选人自选本科担任小组组长的项目，随后被问从中有怎样的成长或感受。Reazon 的 27 卒游戏部门二面则明确接着追问，“团队合作最重要的是什么？为了这一点，你平时具体怎么做？”两者均未给出作品名。\u003ca target=\"_blank\" rel=\"noopener noreferrer\" href=\"https://www.onecareer.jp/companies/378/experiences/2026/1734/1080707\">26卒 Visional（ビズリーチ） · 实习一面\u003c/a> · \u003ca target=\"_blank\" rel=\"noopener noreferrer\" href=\"https://www.xiaohongshu.com/explore/6a50dda10000000015027c3e\">小红书 · 人肉まん\u003c/a>\u003c/li>\n\u003cli>\u003cstrong>针对作品背后的设计判断。\u003c/strong> 26 卒 UI/UX 求职者 Riku 把实习面试分成常规提问和作品发表。展示作品集或应聘作业后，他记录了制作中在意哪处、为什么采用这种设计。作者列过 Mercari、DeNA 等实习经历，但提问清单没逐题指名公司。\u003ca target=\"_blank\" rel=\"noopener noreferrer\" href=\"https://note.com/riku_design_note/n/n7d40e5d740e0\">C21 · note（日语）\u003c/a>\u003c/li>\n\u003cli>\u003cstrong>有名字也有成品的项目。\u003c/strong> 25 卒 Se1gi 展示了饮食 App \u003cstrong>《Mealhelper》\u003c/strong>，是作者在 DeNA 五日实习里做的，后来收进求职作品集。另一篇求职回顾说 DeNA 实习作品在其他公司的选考中得到好评，没给公司名、轮次或原问。两帖属于同一位作者。\u003ca target=\"_blank\" rel=\"noopener noreferrer\" href=\"https://www.xiaohongshu.com/explore/67bdb8ac0000000028036e2b\">小红书 · Se1gi\u003c/a> · \u003ca target=\"_blank\" rel=\"noopener noreferrer\" href=\"https://www.xiaohongshu.com/explore/65e969b0000000000102b0e6\">小红书 · Se1gi\u003c/a>\u003c/li>\n\u003cli>\u003cstrong>能暂停看日语问题的中文视频。\u003c/strong> 一位日本 UI/UX 转职者在 \u003cstrong>01:41–01:46\u003c/strong> 展示日语题卡。一个问题先问插广告会不会妨碍用户体验，接着问怎么应对。另一题问，把新手引导与设置页合并之后，A/B 测试指标为什么反而下降。未公开具体功能名、指标和答案，适合拿自己的项目练产品追问。\u003ca target=\"_blank\" rel=\"noopener noreferrer\" href=\"https://www.xiaohongshu.com/explore/6919dd860000000005033687\">小红书 · 五号君\u003c/a>\u003c/li>\n\u003c/ol>\n\u003ch2>中文、英文、论坛和视频各补到了什么\u003c/h2>\n\u003cul>\n\u003cli>\u003cstrong>中文记录、英文面试。\u003c/strong> Simon 写的是东京 Indeed 2018 年的转职。主管面让他讲一到两个过往项目。下一关另给约一周，做产品新功能的最小可行版本（MVP）。发表后被问到三个问题。若再多三个月会怎样调整？只准留一个功能会留哪个？怎样验证，用什么指标衡量成功？本档只取他在日本的经历。\u003ca target=\"_blank\" rel=\"noopener noreferrer\" href=\"https://aapd.com.tw/all-articles/ui-ux-interview-experience-japan-australia\">C14 · AAPD\u003c/a>\u003c/li>\n\u003cli>\u003cstrong>英文版候选人回忆。\u003c/strong> CADDi 产品设计师 Yuri 说，CTO 终面先问她过去负责的产品该往哪里走、有哪些风险，之后才聊设计细节。她于 2025 年以有经验设计师身份入社。另有一位在日本找新卒工作的马来西亚 UI/UX 设计师在 Reddit 写了多轮求职经历，未披露公司与具体题。Fuller 26 卒、KDDI 25 卒的日英访谈也已归档，未发现能绑定具体展示作品的招聘实问。\u003ca target=\"_blank\" rel=\"noopener noreferrer\" href=\"https://caddiinc.com/n/na06876e15b85?hl=en\">C19 · 原帖\u003c/a> · \u003ca target=\"_blank\" rel=\"noopener noreferrer\" href=\"https://www.reddit.com/r/japanresidents/comments/1rm88gg/career_decision_help_struggling_to_decide_whether/\">C16 · Reddit（英文）\u003c/a> · \u003ca target=\"_blank\" rel=\"noopener noreferrer\" href=\"https://note.fuller-inc.com/n/n3f4f1a0b8bb9\">Fuller 日英访谈\u003c/a> · \u003ca target=\"_blank\" rel=\"noopener noreferrer\" href=\"https://note.com/kddiuxsd/n/n3d58404e5741\">KDDI 日英访谈\u003c/a>\u003c/li>\n\u003cli>\u003cstrong>日本论坛。\u003c/strong> みん就有一篇 Panasonic Connect 25 卒三轮提案回忆，一面谈新界面如何改善体验，二面谈通信设备如何落地，终面谈提案对公司持续成长的价值。岗位未公开，单列为旁证。就活会議的 IBJ 则能同时核到设计岗、27 卒和四次面试。\u003ca target=\"_blank\" rel=\"noopener noreferrer\" href=\"https://www.nikki.ne.jp/company/200504110126071754/naitei/2025/31187/\">E01 · みん就\u003c/a> · \u003ca target=\"_blank\" rel=\"noopener noreferrer\" href=\"https://syukatsu-kaigi.jp/companies/79568/screening_experiences/190609\">27卒 IBJ · 一面\u003c/a>\u003c/li>\n\u003cli>\u003cstrong>招聘者讲解。\u003c/strong> 游戏招聘侧视频约 1:00 讲到，看团队作品时会问哪些部分是你亲手做的。约 5:00 讲为何要区分三个月的项目跨度和自己实际投入的工时。Goodpatch 公开视频约 6:30 介绍的是入社后参加的健康 App 项目。\u003ca target=\"_blank\" rel=\"noopener noreferrer\" href=\"https://www.youtube.com/watch?v=aSiWMm15SIg&t=60\">C18 · YouTube（日文自动字幕）\u003c/a> · \u003ca target=\"_blank\" rel=\"noopener noreferrer\" href=\"https://www.youtube.com/watch?v=n5WbprYE8bI&t=330\">C17 · YouTube（日文自动字幕）\u003c/a>\u003c/li>\n\u003c/ul>\n\u003ch2>检索和计数\u003c/h2>\n\u003cp>以日本 \u003cstrong>25 卒、26 卒、27 卒\u003c/strong>为近三届。用已安装的日本面试调研技能在 ONE CAREER、就活会議、みん就、note、外資就活、Yahoo!知恵袋、5ちゃんねる进行日语初搜，首批得到 42 个不同候选网址，再按公司、岗位和轮次追查。英文查询使用 new graduate、portfolio presentation、design challenge、Tokyo 及公司名等组合。英文版本、英语面试、发帖人国籍是三个不同字段。没有依据的身份不作推断。\u003c/p>\n\u003cp>小红书共查 \u003cstrong>18 组词、92 条去重候选\u003c/strong>，实读 \u003cstrong>25 篇正文、17 条顶层评论\u003c/strong>，另核对能读取的图文和视频题卡。评论里有人说二面邮件要求准备作品集，这只能确认收过通知。CyberAgent 一位作者提到的第二张图未能核到。另检索 B 站和 YouTube，核了两支日语视频的相关字幕。公开范围、平台排序和登录状态都会影响覆盖。\u003c/p>\n\u003cp>“2 位”要求能区分人。按同公司及跨公司两种范围，分别计算本选考与实习。同人多轮、日英镜像、同一作者在不同公司的帖子均保留关联。匿名帖如果只给面试年，单列来源页数。数字描述已收录的样本，不能据此估算某家公司下一场出题的概率。\u003c/p>\n"}]}</script>
<script>
'use strict';
const data=JSON.parse(document.getElementById('archive-data').textContent);
const $=id=>document.getElementById(id);
const escapeHTML=value=>String(value??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const normalize=value=>String(value??'').normalize('NFKC').toLocaleLowerCase().replace(/\s+/g,' ').trim();
const aliases={'サイバーエージェント':'CyberAgent','株式会社サイバーエージェント':'CyberAgent','株式会社コンセント':'CONCENT','ネゾット株式会社':'NEZOT','株式会社メルカリ':'Mercari','セイコーエプソン株式会社':'EPSON','ナビタイムジャパン':'NAVITIME Japan','ギフティ':'giftee','マネーフォワード':'Money Forward','Wedding Park':'WeddingPark','NAVITIME':'NAVITIME Japan','BASE株式会社':'BASE','LINEヤフー株式会社':'LINEヤフー'};
const companyName=name=>aliases[name]||name||'公司未公开';
const searchAliases={'CyberAgent':'サイバーエージェント cyber agent CA','Goodpatch':'グッドパッチ','EPSON':'爱普生 エプソン','NEZOT':'ネゾット WDB','Drecom':'ドリコム','WeddingPark':'wedding park ウエディングパーク','Cybozu':'サイボウズ','Visional（ビズリーチ）':'ビズリーチ Visional BizReach','電通デジタル':'电通数码 电通数字 dentsu digital','楽天':'乐天 Rakuten','アクセンチュア ソング':'埃森哲 accenture song','日本IBM':'IBM','クレオ（KREO）':'KREO','CONCENT':'コンセント','NAVITIME Japan':'ナビタイムジャパン','Money Forward':'マネーフォワード','Mercari':'メルカリ'};
const names=['questions','repeat','scenes','portfolio','sources','guide'];
const state={view:'questions',company:'',q:'',track:'',round:'',format:'',repeat:false,guide:0};
const priority=data.market==='日本'?['CyberAgent','Goodpatch','WeddingPark','EPSON','NEZOT','Drecom','CONCENT','Mercari','Cybozu','IBJ','Visional（ビズリーチ）','楽天']:['美团','腾讯','字节跳动','网易互娱','阿里巴巴','华为 UCD与翻译中心','OPPO','vivo'];
const orderCompany=(a,b)=>{const ia=priority.indexOf(a),ib=priority.indexOf(b);return (ia<0?100:ia)-(ib<0?100:ib)||a.localeCompare(b,'zh-CN');};
const questionMap=new Map(data.questions.map(q=>[q.id,q]));
const allGroups=[...data.groups,...(data.legacyGroups||[])];
const companyCounts=new Map();
for(const q of data.questions){q.companyDisplay=companyName(q.company);q.searchText=normalize(Object.values(q).join(' ')+' '+(searchAliases[q.companyDisplay]||''));companyCounts.set(q.companyDisplay,(companyCounts.get(q.companyDisplay)||0)+1);}
for(const x of [...data.scenes,...data.portfolios,...(data.legacyPortfolios||[]),...data.sources]){const c=companyName(x.company||x['公司']);if(c&&!companyCounts.has(c))companyCounts.set(c,0);}
const companies=Array.from(companyCounts.keys()).sort(orderCompany);
let visibleQuestions=[];let openedBeforePrint=[];
function readHash(){const p=new URLSearchParams(location.hash.slice(1));state.view=names.includes(p.get('view'))?p.get('view'):'questions';state.company=companies.includes(p.get('company'))?p.get('company'):'';state.q=p.get('q')||'';for(const k of ['track','round','format'])state[k]=data.questions.some(q=>q[k]===p.get(k))?p.get(k):'';state.repeat=p.get('repeat')==='1';state.guide=p.get('guide')==='1'&&data.guides.length>1?1:0;}
function writeHash(){const p=new URLSearchParams();for(const k of ['view','company','q','track','round','format'])if(state[k]&&(k!=='view'||state[k]!=='questions'))p.set(k,state[k]);if(state.repeat)p.set('repeat','1');if(state.guide)p.set('guide','1');const next=p.toString()?'#'+p.toString():location.pathname+location.search;try{history.replaceState(null,'',next);}catch(e){/* Local file viewers may restrict URL updates. */}}
function highlight(value){const text=String(value??''),query=state.q.trim();if(!query||query.length>90)return escapeHTML(text);const pattern=new RegExp(query.replace(/[.*+?^$\{\}()|[\]\\]/g,'\\$&'),'gi');let out='',last=0;for(const match of text.matchAll(pattern)){out+=escapeHTML(text.slice(last,match.index))+'<mark>'+escapeHTML(match[0])+'</mark>';last=match.index+match[0].length;}return out+escapeHTML(text.slice(last));}
function safeURL(url){try{const u=new URL(url);return ['http:','https:'].includes(u.protocol)?u.href:'#';}catch(e){return '#';}}
function sourceLink(url,label='查看原帖 ↗',extra=''){return url?`<a href="${escapeHTML(safeURL(url))}" target="_blank" rel="noopener noreferrer" ${extra}>${escapeHTML(label)}</a>`:'';}
function matches(text){return !state.q||normalize(text).includes(normalize(state.q));}
function companyMatches(value){return !state.company||companyName(value)===state.company;}
function choices(id,values,label){$(id).innerHTML='<option value="">'+label+'</option>'+values.map(v=>`<option value="${escapeHTML(v)}">${escapeHTML(v)}</option>`).join('');}
function initChoices(){choices('track',[...new Set(data.questions.map(q=>q.track))],'全部通道');const rounds=['非正式面谈','一面','二面','三面','四面','五面','六面','终面','HR／人事面','五面（HR）','六面（HR）','GD／共同设计（未编号）','集体面试（未编号）','笔试／设计作业','录取后实习活动','其他／未给序号'];choices('round',[...new Set(data.questions.map(q=>q.round))].sort((a,b)=>rounds.indexOf(a)-rounds.indexOf(b)),'全部轮次');choices('format',[...new Set(data.questions.map(q=>q.format))],'全部形式');choices('company-select',companies,'全部公司');}
function renderCompanies(){const query=normalize($('company-search').value);let seenDivider=false;const list=companies.filter(c=>!query||normalize(c+' '+(searchAliases[c]||'')).includes(query));$('company-list').innerHTML=`<button class="company-btn" data-company="" aria-pressed="${!state.company}"><span>全部公司</span><span class="count">${data.questions.length}</span></button>`+list.map(c=>{let divider='';if(!seenDivider&&priority.indexOf(c)<0){divider='<hr class="company-divider">';seenDivider=true;}return divider+`<button class="company-btn" data-company="${escapeHTML(c)}" aria-pressed="${state.company===c}"><span>${escapeHTML(c)}</span><span class="count">${companyCounts.get(c)||'资料'}</span></button>`;}).join('');}
function field(label,value,cls=''){return value?`<div class="detail-block"><span class="label">${escapeHTML(label)}</span><p class="${cls}">${highlight(value)}</p></div>`:'';}
function questionCard(q){const count=Number(q.count);let groupLabel=q.repeatGroup||'';let related=allGroups.filter(g=>(groupLabel.match(/G\d+/g)||[]).includes(g.id));if(groupLabel.includes('日本原表'))related=allGroups.filter(g=>(g.evidence||[]).some(e=>e.id?.split('-')[0]===q.id.split('-')[0])&&g.question===q.kind);const repeatText=related.length?related.map(g=>`${g.scope} · ${g.count} 人 · ${g.question}`).join('\n'):count>1?'人数沿用原档同公司、同招聘通道的核对结果；比较范围可在「重复提问」查阅。':'';const source=data.sources.find(s=>s['编号']===q.id.split('-')[0]);const context=source&&(source['现场说明与限制']||source['核对边界和作品说明']);return `<article class="qcard" id="q-${escapeHTML(q.id)}"><div class="card-head"><div class="card-meta"><span class="co-label">${highlight(q.companyDisplay)}</span><span class="sep">/</span><span>${escapeHTML(q.stage||q.round)}</span><span class="sep">·</span><span>${escapeHTML(q.track)}</span></div><div class="question-head"><h3>${highlight(q.question)}</h3>${count>=2?`<span class="occurrences">至少 ${count} 人提及</span>`:''}</div>${q.work?`<p class="work-line"><span>作品／情境</span>${highlight(q.work)}</p>`:''}</div><details><summary>查看追问背景与出处</summary><div class="details-body">${field('接着什么回答追问',q.parent)}${field('日语口练 · 整理改写',q.practise,'jp-line')}${field('材料原语 · 摘记或要旨',q.original)}${repeatText?`<p class="scope-note">${escapeHTML(repeatText)}</p>`:''}<dl class="detail-grid"><div><dt>岗位与届别</dt><dd>${escapeHTML(q.role)}<br>${escapeHTML(q.cohort)}</dd></div><div><dt>面试形式</dt><dd>${escapeHTML(q.format)}<br>${escapeHTML(q.method)}</dd></div><div><dt>作者／投稿</dt><dd>${escapeHTML(q.author)}</dd></div><div><dt>材料范围</dt><dd>${escapeHTML(q.evidence)} · ${escapeHTML(q.kind)}</dd></div></dl>${field('核对说明',context)}${field('原帖位置',q.location)}<div class="source-row">${sourceLink(q.url)}<span class="source-id">${escapeHTML(q.id)}</span></div></div></details></article>`;}
function sharedMatch(item){return matches(Object.values(item).filter(v=>typeof v==='string').join(' '));}
function groupMatches(g){if(!sharedMatch(g))return false;if(!state.company)return true;return (g.evidence||[]).some(e=>{const q=questionMap.get(e.id)||data.questions.find(q=>q.id.split('-')[0]===String(e.id).replace(/ 原帖$/,''));return q&&q.companyDisplay===state.company;})||normalize(g.company).includes(normalize(state.company));}
function groupCard(g){const links=(g.evidence||[]).map(e=>{const q=questionMap.get(e.id)||data.questions.find(q=>q.id.split('-')[0]===String(e.id).replace(/ 原帖$/,''));return sourceLink(e.url,((q&&q.companyDisplay)||e.id||'候选人原帖')+(q?' · '+q.cohort:'')+' ↗');}).join('');return `<article class="content-card"><div class="card-meta"><span class="co-label">${escapeHTML(g.company)}</span><span class="sep">/</span><span>${escapeHTML(g.scope)}</span></div><div class="question-head"><h3>${highlight(g.question)}</h3>${g.count?`<span class="occurrences">至少 ${g.count} 人提及</span>`:''}</div>${g.note?`<p>${highlight(g.note)}</p>`:''}<div class="evidence-list">${links}</div></article>`;}
function sourceCard(s){const c=s.company||s['公司'];const role=s['岗位']||s['职种']||'';const cohort=s['届别／时间']||s['届别']||'';const author=s['作者／投稿标识']||s['作者／投稿']||'';const title=s['原帖标题／环节']||s['涉及轮次']||s['来源类型']||'';const context=s['现场说明与限制']||s['核对边界和作品说明']||'';return `<article class="content-card"><div class="card-meta"><span class="co-label">${highlight(companyName(c))}</span><span class="sep">/</span><span>${escapeHTML(s['平台'])}</span></div><h3>${highlight(title)}</h3><p>${escapeHTML(role)}<br>${escapeHTML(cohort)}</p>${context?`<p>${highlight(context)}</p>`:''}<p class="sub-label">${escapeHTML(author)} · ${escapeHTML(s['编号'])}</p>${sourceLink(s.url,'查看原帖 ↗','class="source-link"')}</article>`;}
function sceneCard(s){return `<article class="content-card"><div class="card-meta"><span class="co-label">${highlight(companyName(s.company))}</span><span class="sep">/</span><span>${escapeHTML(s.track)}</span></div><h3>${highlight(s.task||'题面未公开')}</h3><p class="sub-label">岗位与形式</p><p>${escapeHTML(s.role)}<br>${escapeHTML(s.format)}</p><p class="sub-label">人数、时长与现场流程</p><p>${highlight(s.context)}</p>${sourceLink(s.url,'查看这场记录 ↗','class="source-link"')}</article>`;}
function portfolioCard(p){return `<article class="content-card"><div class="card-meta"><span class="co-label">${highlight(companyName(p.company))}</span><span class="sep">/</span><span>${escapeHTML(p.role||'')}</span></div><h3>${highlight(p.selection)}</h3><p class="sub-label">作品选择与追问过程</p><p>${highlight(p.chain)}</p>${sourceLink(p.url,'查看完整经历 ↗','class="source-link"')}</article>`;}
function emptyState(){return '<div class="empty"><h3>没有找到符合条件的记录</h3><p>可以减少一个筛选条件，或试试公司名、作品名和其他关键词。</p><button data-reset>清除筛选</button></div>';}
function renderGuide(){const guide=data.guides[state.guide]||data.guides[0];const media=data.media.filter(m=>m.url);return `<div>${data.guides.length>1?`<div class="guide-picker">${data.guides.map((g,i)=>`<button data-guide="${i}" aria-pressed="${i===state.guide}">${escapeHTML(g.title)}</button>`).join('')}</div>`:''}<article class="guide">${guide.html}</article><section class="media-panel"><h2>视频回看</h2><div class="cards">${media.map(m=>`<article class="content-card"><div class="card-meta">${escapeHTML(m.platform)} · ${escapeHTML(m.kind)}</div><h3>${escapeHTML(m.title)}</h3><p>${escapeHTML(m.content)}</p>${sourceLink(m.url,'从 '+m.position+' 回看 ↗','class="source-link"')}</article>`).join('')}</div></section></div>`;}
function syncControls(){for(const k of ['search','track','round','format'])$(k).value=k==='search'?state.q:state[k];$('company-select').value=state.company;$('repeat-only').setAttribute('aria-pressed',String(state.repeat));document.querySelectorAll('[data-view]').forEach(b=>{const active=b.dataset.view===state.view;b.setAttribute('aria-selected',String(active));b.tabIndex=active?0:-1;});$('results').setAttribute('aria-labelledby','tab-'+state.view);$('tools').hidden=state.view==='guide';$('question-filters').hidden=state.view!=='questions';$('expand-all').hidden=state.view!=='questions';$('reset').hidden=state.view==='guide';}
function render(){syncControls();renderCompanies();let html='',number=0,unit='条',note='';if(state.view==='questions'){visibleQuestions=data.questions.filter(q=>companyMatches(q.company)&&matches(q.searchText)&&(!state.track||q.track===state.track)&&(!state.round||q.round===state.round)&&(!state.format||q.format===state.format)&&(!state.repeat||Number(q.count)>=2));const sorted=[...visibleQuestions].sort((a,b)=>orderCompany(a.companyDisplay,b.companyDisplay));html=sorted.map(questionCard).join('');number=sorted.length;note=state.repeat?'人数是本档已核实的下限。展开条目可查看比较范围，原帖中的具体作品与追问可能不同。':'每条保留招聘通道与原帖轮次。点开详情，可看日语口练、材料范围和原帖。';}else if(state.view==='repeat'){const featured=data.groups.filter(groupMatches);const legacy=(data.legacyGroups||[]).filter(groupMatches);html=featured.map(groupCard).join('');if(legacy.length)html+=(featured.length?'<h3 class="section-title">按届别与招聘通道的进一步对照</h3>':'')+legacy.map(groupCard).join('');number=featured.length+legacy.length;unit='组对照';note='同公司与跨公司的比较范围写在各组上方。补充对照与前面部分题目重合，请按单组人数阅读。';}else if(state.view==='scenes'){const list=data.scenes.filter(s=>companyMatches(s.company)&&sharedMatch(s));html=list.map(sceneCard).join('');number=list.length;unit='场记录';note='共同讨论、多人轮流回答、多位面试官面一人，以及入选后的实习项目，都标明实际形式。';}else if(state.view==='portfolio'){const current=data.portfolios.filter(p=>companyMatches(p.company)&&sharedMatch(p));const previous=(data.legacyPortfolios||[]).filter(p=>companyMatches(p.company)&&sharedMatch(p));const list=[...current];for(const p of previous)if(!list.some(x=>x.url===p.url&&x.selection===p.selection&&x.chain===p.chain))list.push(p);html=list.map(portfolioCard).join('');number=list.length;unit='份作品记录';note='看清候选人自选、面试官点名和公司课题，再沿着具体作品追到设计判断。';}else if(state.view==='sources'){const list=data.sources.filter(s=>companyMatches(s.company||s['公司'])&&sharedMatch(s));html=list.map(sourceCard).join('');number=list.length;unit='条来源记录';note='同一篇原帖可能按不同环节记录。作者、岗位与可读范围随行保留，原帖的不同语言版本按同一人核对。';}else{html=renderGuide();note='题目复原与口练改写在文中分别标明。外链可直接回到当事人或招聘方页面。';}
 $('results').className=state.view==='guide'?'':'cards';$('results').innerHTML=html||emptyState();$('result-title').replaceChildren(document.createTextNode(state.view==='guide'?'备考阅读':state.company||'全部公司'));const span=document.createElement('span');span.className='total';span.id='result-count';span.textContent=state.view==='guide'?'':`${number} ${unit}`;$('result-title').appendChild(span);$('result-note').textContent=note;$('expand-all').textContent='展开详情';$('print-note').textContent='当前范围 · '+[state.company||'全部公司',...(state.view==='questions'?[state.track,state.round,state.format,state.repeat?'至少2人提及':'']:[]),state.q?'关键词「'+state.q+'」':''].filter(Boolean).join(' / ');writeHash();}
function changeCompany(value){state.company=value;if(state.view==='guide')state.view='questions';if(!companyCounts.get(value)&&value)state.view='sources';render();$('main-content').scrollIntoView({behavior:'smooth',block:'start'});}
function reset(){state.company='';state.q='';state.track='';state.round='';state.format='';state.repeat=false;$('company-search').value='';render();}
$('company-list').addEventListener('click',e=>{const b=e.target.closest('[data-company]');if(b)changeCompany(b.dataset.company);});$('company-search').addEventListener('input',renderCompanies);$('company-select').addEventListener('change',e=>changeCompany(e.target.value));$('search').addEventListener('input',e=>{state.q=e.target.value;render();});for(const k of ['track','round','format'])$(k).addEventListener('change',e=>{state[k]=e.target.value;render();});$('repeat-only').addEventListener('click',()=>{state.repeat=!state.repeat;render();});$('reset').addEventListener('click',reset);$('results').addEventListener('click',e=>{if(e.target.closest('[data-reset]'))reset();const b=e.target.closest('[data-guide]');if(b){state.guide=Number(b.dataset.guide);render();}});document.querySelector('.tabs').addEventListener('click',e=>{const b=e.target.closest('[data-view]');if(b){state.view=b.dataset.view;render();}});document.querySelector('.tabs').addEventListener('keydown',e=>{if(!['ArrowLeft','ArrowRight','Home','End'].includes(e.key))return;e.preventDefault();let i=names.indexOf(state.view);if(e.key==='ArrowLeft')i=(i+names.length-1)%names.length;if(e.key==='ArrowRight')i=(i+1)%names.length;if(e.key==='Home')i=0;if(e.key==='End')i=names.length-1;state.view=names[i];render();$('tab-'+state.view).focus();});$('expand-all').addEventListener('click',()=>{const details=[...document.querySelectorAll('#results details')];const open=details.some(d=>!d.open);details.forEach(d=>d.open=open);$('expand-all').textContent=open?'收起详情':'展开详情';});
function preparePrint(){openedBeforePrint=[...document.querySelectorAll('#results details')].map(d=>({d,open:d.open}));openedBeforePrint.forEach(x=>x.d.open=true);}
function restorePrint(){openedBeforePrint.forEach(x=>x.d.open=x.open);openedBeforePrint=[];}
for(const id of ['print','print-top'])$(id).addEventListener('click',()=>window.print());window.addEventListener('beforeprint',preparePrint);window.addEventListener('afterprint',restorePrint);window.addEventListener('hashchange',()=>{readHash();render();});initChoices();readHash();render();
</script>
</body></html>
